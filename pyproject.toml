[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mangomas"
version = "0.3.0"
description = "Mango-Mas V2 — modular, local-first agent platform (LM Studio now, GCP later)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mango-Mas" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # Pin a recent ruff so local + CI agree on rule availability (esp. PLC0415).
    "ruff>=0.11,<1.0",
    "mypy>=1.10",
    "httpx>=0.27",
    "hypothesis>=6.100",
]

[project.scripts]
mangomas = "mangomas.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mangomas"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "S", "SLF", "ARG"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
"scripts/*" = ["T201", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mangomas"]
explicit_package_bases = true
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "respx", "respx.*"]
ignore_missing_imports = true

# Test modules use untyped third-party decorators (respx.mock, pytest fixtures
# whose return types mypy can't infer with --strict). Loosen the strictest
# rules just for them; production code under src/ remains fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=mangomas --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: tests that exercise the application through public boundaries",
    "lmstudio: tests that require a reachable LM Studio server",
    "postgres: tests that require a Postgres instance (testcontainers or live)",
    "vertex: tests that require Vertex AI access (ADC + project)",
    "gcp_secrets: tests that require GCP Secret Manager access (ADC + project)",
]

[tool.coverage.run]
branch = true
source = ["mangomas"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
