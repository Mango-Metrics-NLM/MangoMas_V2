[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mangomas"
version = "0.4.0"
description = "Mango-Mas V2 — modular, local-first agent platform (LM Studio now, GCP later)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mango-Mas" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    # Floor, not a runtime dep: hosted runners bake a vulnerable setuptools
    # into the toolcache (79.0.1, PYSEC-2026-3447, fixed in 83.0.0), and the
    # `make pip-audit` gate audits the installed environment — remediating
    # here fixes every environment that installs [dev] instead of
    # suppressing the finding at the audit layer.
    "setuptools>=83.0.0",
    "pytest>=8.2",
    # Exact-pinned together: coverage measurement semantics (branch arcs,
    # exclude_lines handling) are the denominator scripts/check_coverage.py
    # and the two isolated Makefile coverage gates measure — a floating
    # coverage bump can shift a percentage under a green gate. Bump both
    # in one commit.
    "pytest-cov==7.1.0",
    "coverage[toml]==7.15.4",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    # Exact-pinned and kept in lockstep with the ruff-pre-commit rev in
    # .pre-commit-config.yaml so the hook, local pip, and CI cannot drift
    # (rule availability and formatter style both change between releases).
    "ruff==0.16.5",
    # Exact-pinned in lockstep with the mirrors-mypy rev in
    # .pre-commit-config.yaml, for the same reason as the ruff pin above.
    "mypy==2.3.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    # Used by scripts/lint_agent_frontmatter.py (the Claude Code harness linter).
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # Postgres test support: asyncpg is needed for the unit-level DSN tests
    # to collect even when the live testcontainer suite is gated off, and
    # testcontainers powers the gated tests/postgres/ suite when
    # RUN_POSTGRES=1 is set.
    "asyncpg>=0.29",
    # testcontainers 4.x ships the postgres helper inline (no extras needed).
    "testcontainers>=4.7",
]
# Vertex AI provider — install with `pip install 'mangomas[vertex]'`.
# Required runtime SDK; the adapter lazy-imports it so it remains optional.
vertex = [
    "google-cloud-aiplatform>=1.71",
    "google-auth>=2.30",
]
# Cloud SQL Postgres provider — install with `pip install 'mangomas[postgres]'`.
postgres = [
    "asyncpg>=0.29",
]
# In-process embeddings — install with `pip install 'mangomas[embeddings-local]'`.
# The sentence-transformers backend lazy-imports the SDK so it stays optional.
embeddings-local = [
    "sentence-transformers>=2.7",
]
# Retrieval-augmented generation — install with `pip install 'mangomas[rag]'`.
# The Chroma vector store lazy-imports chromadb so it stays optional.
rag = [
    "chromadb>=0.5",
]
# Langfuse eval sink — install with `pip install 'mangomas[langfuse]'`.
# The sink lazy-imports the SDK so it stays optional. Pinned below the v3 API
# rewrite to keep the trace/score surface stable.
langfuse = [
    "langfuse>=2,<3",
]
# GCP Secret Manager provider + Cloud Trace exporter — `pip install 'mangomas[gcp]'`.
gcp = [
    "google-cloud-secret-manager>=2.20",
    "google-auth>=2.30",
    "opentelemetry-exporter-gcp-trace>=1.6",
]
# Convenience meta-extra: install all cloud adapters.
cloud = [
    "mangomas[vertex,postgres,gcp]",
]

[project.scripts]
mangomas = "mangomas.cli.main:app"

# Plugin contract: third-party packages register eval scorers/sinks/targets by
# adding entries to these groups, each pointing at a factory
# `Callable[[dict], Scorer|Sink|Target]`.
# Discovery runs only when MANGOMAS_DISCOVERY_ENABLED=true (see eval/discovery.py).
# Built-ins register in-process, so these groups stay empty here.
#   [project.entry-points."mangomas.eval.scorers"]
#   my_scorer = "mypkg.module:factory"
#   [project.entry-points."mangomas.eval.sinks"]
#   my_sink = "mypkg.module:factory"
#   [project.entry-points."mangomas.eval.targets"]
#   my_target = "mypkg.module:factory"
#   [project.entry-points."mangomas.eval.dataset_sources"]
#   my_source = "mypkg.module:factory"
#
# Third-party agents register under the `mangomas.agents` group, each pointing
# at an agent factory `Callable[[AgentSettings | None], Agent]` (see
# agents/discovery.py). A discovered name that collides with a built-in agent is
# skipped with a warning.
#   [project.entry-points."mangomas.agents"]
#   my_agent = "mypkg.module:factory"

[tool.hatch.build.targets.wheel]
packages = ["src/mangomas"]

# Protected-core-contract set (ADR-0021 / spec-0017). Single source of truth,
# read via stdlib tomllib by both scripts/check_protected_paths.py (the CI
# gate) and scripts/lint_agent_frontmatter.py (the PreToolUse advisory hook) —
# neither may depend on `mangomas` being installed. An edit to one of these
# paths requires a `BREAKING-CHANGE` trailer on at least one commit in the PR;
# see docs/adr/0021-protected-path-governance-contract.md.
[tool.mangomas.governance]
protected_paths = [
    "src/mangomas/core/agent.py",
    "src/mangomas/core/orchestrator.py",
    "src/mangomas/core/structured.py",
    "src/mangomas/core/tools.py",
    "src/mangomas/errors.py",
    "src/mangomas/registry.py",
]
breaking_change_marker_aliases = ["BREAKING-CHANGE", "# approved-breaking-change"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "eval_harness_bridge/src"]

[tool.ruff.lint]
# The second row (spec-0020 R4) was adopted as a ratchet, not a cleanup: every
# family was measured across all four lint paths first, and eight of the nine
# were already at zero. Locking in a property the code already has costs
# nothing and stops it eroding.
#   LOG, G      no f-strings or eager formatting in log calls
#   ASYNC       no blocking work inside `async def` (see ASYNC240 below)
#   ERA         no commented-out code
#   DTZ         no naive datetimes
#   TID         no banned or relative imports
#   C4          comprehension hygiene            (2 hits, auto-fixed)
#   PTH         pathlib over os.path             (1 hit in tests, fixed)
#   T20         no stray print() in library code (0 in src and tests)
select = [
    "E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "S", "SLF", "ARG",
    "LOG", "G", "ASYNC", "ERA", "DTZ", "TID", "C4", "PTH", "T20",
]
# PLR0913: constructors and typer CLI commands are argument-heavy by design.
# PLR0917 (positional-count) stays ON globally — it is the guard against a
# silent positional-parameter reorder in a shared base class.
#
# ASYNC240 tells you to replace `pathlib` inside `async def` with `trio.Path` or
# `anyio.path`. This project is asyncio-only and depends on neither. All four
# hits were synchronous `Path.read_text()` in async *test assertions*, which is
# correct code — obeying the rule would mean taking a dependency to satisfy a
# linter. Excluded by name so the reason survives.
ignore = ["PLR0913", "ASYNC240"]

# Deliberately NOT selected (spec-0020 F5), recorded so they are not
# re-proposed without the reasoning:
#
#   N     (9)  — N818 demands renaming `AgentNotFound` and four siblings to an
#                `...Error` suffix. That is a breaking change to the public
#                error taxonomy, on a protected path (`src/mangomas/errors.py`),
#                mapped in `api/errors.py::_ERROR_STATUS` and documented in
#                CLAUDE.md, in exchange for a naming convention. N806 also
#                fires on `Content`/`Part` in `adapters/llm/vertex.py`, which
#                are lazily-imported *classes* bound to locals — correctly
#                capitalised.
#   TRY  (96)  — real churn, no defect behind it.
#   FBT  (18)  — same. Revisit either only alongside a change that already
#                touches those call sites.

[tool.ruff.lint.isort]
# CLAUDE.md requires `from __future__ import annotations` in every source file.
# It was prose until now: a sweep found exactly one violation in 133 files
# (harness/__init__.py), which nothing would have caught. ruff adds it on
# --fix and fails the lint without.
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
# ruff >= 0.16 formats code fences inside Markdown; the agent and skill docs
# under .claude/ format their example snippets for readability (multi-line
# JSON bodies), so keep the formatter off Markdown.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# SLF001: tests routinely assert on adapter internals (e.g. lazy-pool state).
"tests/*" = ["PLR2004", "S101", "SLF001"]
# PLC0414: the constants hub re-exports config defaults via the explicit
# ``X as X`` idiom so they read as re-exports, not unused imports.
"tests/constants.py" = ["PLC0414"]
# T201/PTH: `scripts/` are operator-facing CLI entry points and Claude Code
# hooks whose entire contract is what they print on stdout, and several must
# run on a bare interpreter with no `mangomas` installed — `os.path` keeps them
# dependency-free and obvious. Both rules stay active for `src/` and `tests/`,
# where a stray `print()` really is a defect.
"scripts/*" = ["S603", "S607", "T201", "PTH"]
# Same reasoning: the eval bridge is a decoupled black-box client whose output
# is its interface.
"eval_harness_bridge/*" = ["T201"]
# PLR0917: these two signatures are fixed by external contract, not by choice.
# `LMStudioClient.__init__` is a public adapter constructor frozen for
# backwards compatibility (its shared base is keyword-only); `eval_cmd` is a
# typer command whose options must stay positional parameters. Narrow ignores
# keep PLR0917 active as a guard everywhere else.
"src/mangomas/adapters/llm/lmstudio.py" = ["PLR0917"]
"src/mangomas/cli/commands/eval.py" = ["PLR0917"]
# SLF001: the command layer calls `_runtime._build()` / `_close_orchestrator()`
# through the module object rather than a bound name. That is deliberate — it
# is what lets one `monkeypatch.setattr` on `mangomas.cli._runtime` reach every
# command at once, where bound names would need a separate patch target per
# module and the one that got missed would fail silently (measured: 13 of 15
# such sites did). The names stay underscore-private because they are a test
# seam, not API.
"src/mangomas/cli/commands/*.py" = ["SLF001"]
# PLC0414: `mangomas.cli.main` is a permanent re-export facade (ADR-0019 /
# spec-0015), and `X as X` is the explicit re-export idiom mypy's
# --no-implicit-reexport requires. Ruff exempts `__init__.py` from this rule
# automatically; `main.py` is a facade that is not one, because the console
# script in [project.scripts] resolves `mangomas.cli.main:app`. Same idiom, and
# same reason, as the `tests/constants.py` ignore above.
"src/mangomas/cli/main.py" = ["PLC0414"]
# PLC0414: `mangomas.core.tools` is likewise a permanent re-export facade
# (ADR-0019 / spec-0015 R4) for the structured-output surface extracted to
# `core/structured.py` — a module facade, not an `__init__.py`, so ruff's
# automatic exemption does not apply.
"src/mangomas/core/tools.py" = ["PLC0414"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:eval_harness_bridge/src:scripts"
# `files` mirrors the Makefile's CODE_PATHS so a bare `mypy` checks exactly what
# `make typecheck` and CI check. Without it, `packages = ["mangomas"]` alone
# limited a bare run to src/ — 155 files against CI's 324 — so a contributor
# following CLAUDE.md got a weaker check than the gate and only found out on
# push. `tests/deploy/test_ci_make_parity.py` locks the two lists together.
files = ["src", "tests", "scripts", "eval_harness_bridge/src"]
explicit_package_bases = true
warn_unused_ignores = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "respx",
    "respx.*",
    "asyncpg",
    "asyncpg.*",
    "testcontainers",
    "testcontainers.*",
    # google/vertexai entries: the Vertex SDK is an optional extra; the
    # adapters lazy-import it and mypy must not require stubs that ship with
    # `mangomas[vertex]` to be installed.
    "google",
    "google.*",
    "google.cloud",
    "google.cloud.*",
    "google.api_core",
    "google.api_core.*",
    "google.auth",
    "google.auth.*",
    "google.oauth2",
    "google.oauth2.*",
    "vertexai",
    "vertexai.*",
    "chromadb",
    "chromadb.*",
    "langfuse",
    "langfuse.*",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true

# Test modules use untyped third-party decorators (respx.mock, pytest fixtures
# whose return types mypy can't infer with --strict). Loosen the strictest
# rules just for them; production code under src/ remains fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
# --cov-fail-under mirrors GLOBAL_FLOOR in scripts/check_coverage.py — the
# authoritative gate (per-package floors live there); keep the two in sync.
addopts = "-ra --strict-markers --cov=mangomas --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
asyncio_mode = "auto"
# Pinned to the value pytest-asyncio has announced as its future default.
# Left unset it emits a deprecation warning and will change under us on a
# minor bump; pinning it means the change is a reviewed edit here rather
# than a surprise in CI. Verified: the suite is green under this scope.
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "eval_harness_bridge/src"]
markers = [
    "integration: tests that exercise the application through public boundaries",
    "lmstudio: tests that require a reachable LM Studio server",
    "postgres: tests that require a Postgres instance (testcontainers or live)",
    "vertex: tests that require a reachable Vertex AI project (ADC + project_id)",
    "gcp_secrets: tests that require GCP Secret Manager access (ADC + project)",
    "gcp_trace: tests that require the Cloud Trace exporter extra installed (RUN_GCP_TRACE=1)",
    "embeddings_local: tests that require the sentence-transformers extra installed",
    "rag: tests that require the chromadb extra installed",
    "langfuse: tests that require the langfuse extra installed (RUN_LANGFUSE=1)",
    "gitleaks: tests that shell out to the real gitleaks binary (RUN_GITLEAKS=1)",
]

[tool.coverage.run]
branch = true
source = ["mangomas"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# The two ellipsis patterns are anchored to the *end* of a line, which is where
# a Protocol stub body puts one. `src/` uses both stub forms — 30 on their own
# line, 3 inline after the signature — so both need a pattern.
#
# Unanchored (`"\\.\\.\\."`, as it was) the pattern matched any line containing
# three dots, including every `typer.Argument(..., help="…")` in a CLI command
# signature. Coverage excludes the whole block when the excluded line belongs to
# a `def` header, so entire command bodies vanished from measurement:
# `cli/commands/rag.py` reported 16 statements where coverage's own parser sees
# 53, and two untested `--verbose` branches sat inside the invisible region
# while the file reported 100%. An over-matching exclusion is silent and it
# makes the percentage go *up*, so nothing flags it.
#
# `tests/test_check_coverage.py` guards both directions: no pattern may match
# real source, and a stub of either form must still match one.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    ": \\.\\.\\.$",
]
