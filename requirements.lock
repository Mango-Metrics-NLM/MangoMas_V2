# Runtime-dependency constraints lockfile (roadmap item 0.3, supply-chain
# baseline). Pins the full transitive closure of pyproject.toml's [project]
# dependencies so container builds are version-reproducible: the Dockerfile's
# runtime stage passes this file to pip as a constraints file (`-c`), which
# pins versions without adding dependencies.
#
# This file is GENERATED — do not edit by hand. Regenerate (Python 3.11, the
# same interpreter the runtime image ships) after changing [project]
# dependencies:
#
#   pip install pip-tools
#   pip-compile --strip-extras --no-header --output-file=requirements.lock pyproject.toml
#
# --strip-extras is required: pip rejects extras in constraints files.
# Dev/extras pins are out of scope here (dev tooling is pinned in pyproject's
# [dev] extra where reproducibility matters); Dependabot's pip ecosystem entry
# (.github/dependabot.yml) keeps these pins fresh.
