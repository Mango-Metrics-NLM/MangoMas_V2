repos:
  # ── Ruff: linting + formatting ─────────────────────────────────────────────
  # Keep this rev in lockstep with the `ruff==` pin in pyproject's dev extra so
  # the hook, local pip, and CI all run the identical linter/formatter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ── mypy: static type checking ─────────────────────────────────────────────
  # Scoped to src/ only: additional_dependencies below covers exactly the
  # runtime deps, which is all src/ needs. Everything else in CI's surface
  # (tests, scripts, eval_harness_bridge/src, mango-integration-contracts/src)
  # pulls in far more — pytest, respx, hypothesis, asyncpg — and is type-checked
  # authoritatively by CI's full `mypy --strict` over CODE_PATHS, so the hook
  # trades breadth for fast, dependency-accurate local feedback. Contracts stay
  # on `mypy_path` so `src/mangomas/cognitive/` typechecks against the envelope
  # without widening this hook's `files:` glob.
  # Keep the rev in lockstep with the `mypy==` pin in pyproject's dev extra.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--strict]
        files: ^src/
        additional_dependencies:
          - fastapi>=0.115
          - pydantic>=2.7
          - pydantic-settings>=2.3
          - httpx>=0.27
          - opentelemetry-api>=1.25
          - opentelemetry-sdk>=1.25
          - typer>=0.27.2
          - starlette>=0.40

  # ── Misc: file hygiene ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  # ── Agent/skill frontmatter lint ────────────────────────────────────────────
  # Previously CI-only (the `frontmatter` job in ci.yml / `make frontmatter`),
  # so a broken agent or SKILL.md only surfaced after a push. This local
  # hook runs the identical full-repo validation before commit; `files:` only
  # decides whether the hook fires this run — the script itself always scans
  # the whole corpus (pass_filenames: false).
  #
  # Path-anchored rather than filename-only: the previous
  # `(\.agent\.md|SKILL\.md)$` fired on any file with those names anywhere in
  # the tree, including test fixtures, while saying nothing about location.
  # The agent half is scoped to the `mango-` prefix so a contributor's own
  # agent, written into the same flat directory by `/agents`, does not trigger
  # a corpus-wide lint on every commit that touches it.
  - repo: local
    hooks:
      - id: lint-agent-frontmatter
        name: Lint agent/skill frontmatter
        entry: python scripts/lint_agent_frontmatter.py
        language: system
        pass_filenames: false
        files: ^\.claude/(skills/.*/SKILL\.md|agents/mango-.*\.md)$
      # Cheap Makefile mirrors. Pre-commit is a subset of `make gate` (no
      # coverage floors, no protected-paths). Stop stays typecheck+format-check
      # + pytest --no-cov and must not become the gate.
      - id: validate-config
        name: Validate Claude/MCP JSON config
        language: system
        pass_filenames: false
        entry: >-
          python -c "import json; from pathlib import Path;
          [json.loads(Path(p).read_text(encoding='utf-8'))
          for p in ('.mcp.json', '.claude/settings.json',
          '.claude/settings.local.json.example')]"
      - id: lint-imports
        name: Import-linter layering contracts
        language: system
        pass_filenames: false
        entry: >-
          python -c "from importlinter.cli import lint_imports;
          raise SystemExit(lint_imports(no_logo=True))"
