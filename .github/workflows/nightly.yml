name: Nightly

# The repo had zero scheduled automation. Two gaps that only a schedule closes:
#
#  * `make secret-scan` runs on push only, so a credential committed to a
#    branch nobody has pushed to since is never re-examined. It is deliberately
#    excluded from `make gate` (that chain is fully offline), which makes the
#    push job its only trigger.
#  * Seven opt-in suites run nowhere, ever. `postgres` needs only Docker, which
#    GitHub runners provide — and ci.yml already records why that matters:
#    "excluded from CI purely because nothing set the gate, which is how a
#    Postgres row-shape defect shipped behind a green pipeline."
#
# `embeddings-local` joined them (spec-0029 R6): it needs no service and no
# credentials, only CPU torch wheels and a small model download, both of which
# a vanilla runner can do. It is also the only suite that runs real numerical
# compute, so it is the only place the device contract can be exercised.
#
# The remaining gated suites (lmstudio, vertex, gcp-*, langfuse) need a local
# process, cloud credentials or an extra that vanilla runners do not have, so
# they stay manual — each with its reason recorded in
# `tests.constants.HOSTED_RUNNER_INFEASIBLE` and enforced by
# `tests/deploy/test_gated_suite_homes.py`, so "it cannot run in CI" is a
# claim something checks rather than a thing people remember.

on:
  schedule:
    # 03:17 UTC — off the hour, so this does not pile onto the top-of-hour
    # surge that GitHub's shared runners see.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  postgres:
    name: Postgres suite (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Postgres suite
        run: make postgres

  embeddings-local:
    name: Local embeddings + RAG suite (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # The default Linux torch wheel bundles CUDA runtime libraries and is
      # several GB. This runner has no GPU, so that download is pure cost —
      # installing the CPU build FIRST means the extras below resolve against
      # an already-satisfied torch instead of pulling the CUDA one.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -e ".[dev,embeddings-local,rag]"
          pip install -e ./mango-integration-contracts

      # Keyed on the model id so a model change invalidates the cache rather
      # than silently testing against the previous one.
      - name: Cache the sentence-transformers model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      # MANGOMAS_EMBEDDINGS__DEVICE is deliberately NOT set: this runner has no
      # GPU, so the library's auto-detect resolves to CPU on its own. Forcing
      # the device would mask a broken auto-detect — the suite's device-parity
      # test compares forced-CPU against auto, and pinning both halves to the
      # same value would make it vacuous.
      - name: Local embeddings + RAG suite
        run: make embeddings-local

  secret-scan:
    name: Secret scan (working tree + history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The `git` pass scans committed history, so it needs all of it.
          fetch-depth: 0

      - name: Secret scan
        run: make secret-scan

      # `make secret-scan` exiting 0 proves nothing on its own — a scanner
      # configured down to zero rules is indistinguishable from a clean tree.
      # This runs the same pinned binary, downloaded by the step above, against
      # planted secrets and requires it to still fail. It lives here rather
      # than in the unit suite because that suite is fully offline.
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Prove the secret scan can still fail
        run: make gitleaks-selftest

  sbom-scan:
    name: SBOM / Trivy (baseline, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # First scan is a baseline: the Make target uses `--exit-code 0` so
      # findings do not fail the job. Not a PR CI gate. continue-on-error
      # covers download flakes on this first landing.
      - name: CycloneDX SBOM and Trivy filesystem scan
        run: make sbom-scan

  # A scheduled run nobody watches is a gate that reports to no one. GitHub
  # emails only the account that last touched the cron, and only for the
  # *first* failure in a run of consecutive ones, so a suite that breaks and
  # stays broken goes quiet after night one — the exact shape of the Postgres
  # defect this workflow exists to catch.
  #
  # Deduped by title: at most one open issue at a time, with a comment per
  # subsequent failure, so a week of red produces one thread rather than seven
  # issues. `gh` and GITHUB_TOKEN are both already on the runner, so this needs
  # no action to pin and no secret to provision.
  notify:
    name: File a tracking issue on failure
    runs-on: ubuntu-latest
    needs: [postgres, embeddings-local, secret-scan, sbom-scan]
    if: failure()
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "Nightly workflow is failing"
    steps:
      - name: Open or update the tracking issue
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$REPO" --state open \
            --search "$TITLE in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")"
          body="The nightly workflow failed: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
