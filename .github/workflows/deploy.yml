name: Deploy to Cloud Run

# Author-only pipeline (ADR-0001): builds the image, pushes it to Artifact
# Registry, and deploys to Cloud Run on a published release. Authentication is
# via Workload Identity Federation — NO service-account JSON keys. The
# workflow references GitHub Actions secrets by name only (their values live in
# repo settings, never in the repo).

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    env:
      REGION: us-central1
      SERVICE: mangomas
      REPOSITORY: mangomas
      # Bound to env vars (never inlined into a run: body) to avoid ${{ }}
      # expression injection into a credentialed shell — the same idiom as
      # eval-gate.yml's AGENTS_REF. A release tag name is event payload.
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_TAG: ${{ github.event.release.tag_name || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        # Third-party actions are pinned to full commit SHAs (supply-chain
        # hardening); Dependabot's github-actions ecosystem keeps them fresh.
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --no-allow-unauthenticated
