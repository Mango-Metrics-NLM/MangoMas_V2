name: Deploy to Cloud Run

# Author-only pipeline (ADR-0001): verifies the offline test gate, builds the
# image, pushes it to Artifact Registry, applies deploy/service.yaml to Cloud
# Run and smoke-probes the deployed revision on a published release
# (spec-0024). Authentication is via Workload Identity Federation — NO
# service-account JSON keys. The workflow references GitHub Actions secrets by
# name only (their values live in repo settings, never in the repo).

on:
  release:
    types: [published]
  workflow_dispatch: {}

# Least-privilege default for every job; the WIF `id-token: write` grant is
# scoped to the deploy job below, not the whole workflow.
permissions:
  contents: read

jobs:
  verify:
    # Absorbs the deferred "`verify` job gating `deploy.yml`" item
    # (NEXT_STEPS.md, spec-0024): a release publish must not deploy code that
    # fails the offline test gate. Steps delegate to `make` like every CI job
    # (tests/deploy/test_ci_make_parity.py's one-place rule).
    name: Verify before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Run pytest with coverage
        run: make test

      - name: Per-package coverage floors
        run: make coverage

      - name: Contracts coverage floor
        run: make contracts-coverage

  deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    env:
      REGION: us-central1
      SERVICE: mangomas
      REPOSITORY: mangomas
      # Bound to env vars (never inlined into a run: body) to avoid ${{ }}
      # expression injection into a credentialed shell — the same idiom as
      # eval-gate.yml's AGENTS_REF. A release tag name is event payload.
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      IMAGE_TAG: ${{ github.event.release.tag_name || github.sha }}
      # Smoke-probe tunables (workflow env, not hard-coded in the script):
      # /readyz exercises the live LLM/DB reachability probe, so allow the
      # revision a short settling window before declaring the deploy failed.
      SMOKE_ATTEMPTS: "10"
      SMOKE_RETRY_SECONDS: "6"
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        # Third-party actions are pinned to full commit SHAs (supply-chain
        # hardening); Dependabot's github-actions ecosystem keeps them fresh.
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${IMAGE_TAG}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Render service manifest
        # deploy/service.yaml is the single source of production configuration
        # (env vars, secretKeyRefs, probes, resource limits, autoscaling
        # bounds — spec-0024). Only the image reference is rendered at deploy
        # time; every other field reaches Cloud Run verbatim via the
        # `services replace` step below. The grep proves the substitution
        # actually landed, so a manifest reshape cannot silently deploy the
        # placeholder image.
        run: |
          set -euo pipefail
          sed -E "s|^([[:space:]]*)- image: .*$|\1- image: ${IMAGE}|" \
            deploy/service.yaml > rendered-service.yaml
          grep -qF "image: ${IMAGE}" rendered-service.yaml

      - name: Apply service manifest to Cloud Run
        # `gcloud run services replace` applies the full Knative manifest —
        # unlike the previous image-only `gcloud run deploy`, which dropped
        # every env var, secretKeyRef, probe, limit and autoscaling bound.
        # `replace` never touches IAM: it creates no allUsers invoker binding,
        # so the service stays private (the former --no-allow-unauthenticated
        # posture) by default.
        run: |
          set -euo pipefail
          gcloud run services replace rendered-service.yaml --region "$REGION"

      - name: Smoke-test deployed service (/healthz + /readyz)
        # The service is private (no allUsers run.invoker binding — see the
        # step above), so an anonymous probe would get 401/403 and prove
        # nothing about health. The probe authenticates with an identity token
        # minted from the WIF-federated deploy service account
        # (`gcloud auth print-identity-token`); that account must therefore
        # hold roles/run.invoker on the service. `curl -f` turns any non-2xx
        # into a non-zero exit, failing the job.
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')"
          TOKEN="$(gcloud auth print-identity-token)"
          for path in /healthz /readyz; do
            ok=0
            for _ in $(seq 1 "$SMOKE_ATTEMPTS"); do
              if curl -fsS -m 10 -H "Authorization: Bearer ${TOKEN}" "${URL}${path}" > /dev/null; then
                ok=1
                break
              fi
              sleep "$SMOKE_RETRY_SECONDS"
            done
            if [ "$ok" -ne 1 ]; then
              echo "smoke probe FAILED: ${path} never returned 200" >&2
              exit 1
            fi
            echo "smoke probe OK: ${path}"
          done
