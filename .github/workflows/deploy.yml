name: Deploy (Cloud Run)

# Builds the container image, pushes it to Artifact Registry, and rolls out a
# Cloud Run revision via Terraform. Authentication is keyless (Workload Identity
# Federation) — no service-account JSON key is stored in the repository.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   vars.GCP_PROJECT_ID   GCP project id
#   vars.GCP_REGION       Region (e.g. us-central1)
#   vars.WIF_PROVIDER     Full WIF provider resource name (terraform output)
#   vars.DEPLOY_SA        Deployer service-account email (terraform output)
#   vars.AR_REPOSITORY    Artifact Registry repository id (default: mangomas)
#   vars.SERVICE_NAME     Cloud Run service name (default: mangomas)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and deploy (defaults to the git sha)."
        required: false
        type: string

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'mangomas' }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY || 'mangomas' }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve image reference
        id: image
        run: |
          set -euo pipefail
          REG="${{ vars.GCP_REGION }}-docker.pkg.dev"
          REF="${REG}/${{ vars.GCP_PROJECT_ID }}/${AR_REPOSITORY}/${SERVICE_NAME}:${IMAGE_TAG}"
          echo "ref=${REF}" >>"$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "${{ steps.image.outputs.ref }}" .
          docker push "${{ steps.image.outputs.ref }}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: deploy/terraform
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: deploy/terraform
        run: |
          terraform apply -input=false -auto-approve \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "region=${{ vars.GCP_REGION }}" \
            -var "service_name=${SERVICE_NAME}" \
            -var "artifact_repository_id=${AR_REPOSITORY}" \
            -var "github_repo=${{ github.repository }}" \
            -var "image=${{ steps.image.outputs.ref }}"
