name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["feat/initial-release"]

# Least-privilege token: CI only needs to read the repo. codecov upload uses its
# own token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Validate Claude Code config JSON
        run: make validate-config

      - name: Ruff check
        run: make lint

      - name: Ruff format (check only)
        run: make format-check

      - name: Frontmatter lint
        run: make frontmatter

      - name: mypy strict
        run: make typecheck

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: make install

      - name: Run pytest with coverage
        # pyproject addopts supplies --cov=mangomas, term-missing, and the
        # global --cov-fail-under=95 (mirroring scripts/check_coverage.py,
        # the authoritative gate run in the next step); `make test-xml` adds
        # only the coverage.xml report needed for the codecov upload below.
        run: make test-xml

      - name: Per-package coverage floors
        run: make coverage

      # Both suites are gated by an env var so a normal `pytest` run stays fast,
      # but neither needs a service, an extra, or the network — `tests/rag` is
      # fakes-only and `tests/integration` drives the app over ASGI in-process.
      # They were excluded from CI purely because nothing set the gate, which is
      # how a Postgres row-shape defect shipped behind a green pipeline.
      - name: Gated suites that need no external service
        run: make gated-suites

      - name: Upload coverage report
        # Third-party action pinned to a full commit SHA (supply-chain
        # hardening — codecov's 2021 uploader compromise is the case study);
        # Dependabot's github-actions ecosystem keeps the pin fresh.
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: coverage.xml
          fail_ci_if_error: false

  protected-paths:
    name: Protected-path governance gate
    runs-on: ubuntu-latest
    env:
      # Single source of truth for this job — referenced by both steps below
      # so the two can't independently drift to different trunks.
      BASE_BRANCH: feat/initial-release
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required: the gate diffs against another branch's
          # tip and walks the commit-message range between them, neither of
          # which a shallow (default) checkout can resolve.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # scripts/check_protected_paths.py is stdlib-only (tomllib) by design
      # (ADR-0021) — it must run without `mangomas` installed, so there is no
      # "Install dependencies" step in this job.
      - name: Fetch base branch for protected-path diff
        run: git fetch origin ${{ env.BASE_BRANCH }}

      - name: Protected-path governance gate
        run: make protected-paths BASE_REF=origin/${{ env.BASE_BRANCH }}

  bridge-coverage:
    name: Bridge coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      # The bridge lives outside the mangomas package, so the --cov=mangomas
      # gate never measures it. `make bridge-coverage` enforces its own 100%
      # floor in isolation (-o addopts="" sheds the inherited --cov=mangomas,
      # and COVERAGE_FILE=.coverage.bridge keeps its data file separate from
      # the main suite's). Kept a separate job so the two floors are
      # independent and each failure is attributable.
      - name: Bridge coverage (isolated, floor 100%)
        run: make bridge-coverage

  contracts-coverage:
    name: Contracts coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      # mango_contracts lives outside the mangomas package, so the
      # --cov=mangomas gate never measures it. Same isolation idiom as
      # bridge-coverage: its own COVERAGE_FILE + -o addopts="". Floor 100%.
      - name: Contracts coverage (isolated, floor 100%)
        run: make contracts-coverage

  scripts-coverage:
    name: Scripts coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      # scripts/ lives outside the mangomas package, so the --cov=mangomas
      # gate never measures it (ADR-0021 / spec-0017 A7). Same isolation
      # idiom as bridge-coverage: its own COVERAGE_FILE + -o addopts="".
      # Floor is the measured actual (see Makefile's SCRIPTS_FLOOR comment),
      # not an assumed 95 — scripts/check_coverage.py itself is the drag.
      - name: Scripts coverage (isolated, measured floor)
        run: make scripts-coverage

  pip-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: make install

      # The pinned-tool install and the audit invocation live in exactly one
      # place: `make pip-audit` (supply-chain baseline, roadmap item 0.3).
      # Like `secret-scan`, it needs the network (PyPI advisory DB), which is
      # why it is a CI job here and not part of the offline `make gate` chain.
      - name: pip-audit installed environment
        run: make pip-audit

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The download-and-scan recipe (and the reasoning for invoking the raw
      # binary instead of the paid gitleaks-action wrapper) now lives in
      # exactly one place: `make secret-scan`. This job just calls it, like
      # every job above.
      - name: Gitleaks secret scan
        run: make secret-scan
