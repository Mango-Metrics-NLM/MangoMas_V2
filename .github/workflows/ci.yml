name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check src tests scripts eval_harness_bridge

      - name: Ruff format (check only)
        run: python -m ruff format --check src tests scripts eval_harness_bridge

      - name: Frontmatter lint
        run: python scripts/lint_agent_frontmatter.py

      - name: mypy strict
        run: python -m mypy --strict src tests scripts eval_harness_bridge

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: |
          python -m pytest \
            --cov=mangomas \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            -q

      - name: Per-package coverage floors
        run: python scripts/check_coverage.py

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # We invoke the open-source ``gitleaks`` binary directly rather than the
      # ``gitleaks/gitleaks-action@v2`` wrapper, which requires a paid licence
      # for organisation accounts. The binary itself is MIT-licensed and free.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan repository
        run: ./gitleaks detect --no-banner --redact --exit-code 1 --source .
