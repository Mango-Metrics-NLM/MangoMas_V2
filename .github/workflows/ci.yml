name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

# Least-privilege token: CI only needs to read the repo. codecov upload uses its
# own token, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate Claude Code config JSON
        run: make validate-config

      - name: Ruff check
        run: make lint

      - name: Ruff format (check only)
        run: make format-check

      - name: Frontmatter lint
        run: make frontmatter

      - name: mypy strict
        run: make typecheck

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        # pyproject addopts supplies --cov=mangomas, term-missing, and the
        # global --cov-fail-under=95 (mirroring scripts/check_coverage.py,
        # the authoritative gate run in the next step); `make test-xml` adds
        # only the coverage.xml report needed for the codecov upload below.
        run: make test-xml

      - name: Per-package coverage floors
        run: make coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  bridge-coverage:
    name: Bridge coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # The bridge lives outside the mangomas package, so the --cov=mangomas
      # gate never measures it. `make bridge-coverage` enforces its own 100%
      # floor in isolation (-o addopts="" sheds the inherited --cov=mangomas,
      # and COVERAGE_FILE=.coverage.bridge keeps its data file separate from
      # the main suite's). Kept a separate job so the two floors are
      # independent and each failure is attributable.
      - name: Bridge coverage (isolated, floor 100%)
        run: make bridge-coverage

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # We invoke the open-source ``gitleaks`` binary directly rather than the
      # ``gitleaks/gitleaks-action@v2`` wrapper, which requires a paid licence
      # for organisation accounts. The binary itself is MIT-licensed and free.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan repository
        run: ./gitleaks detect --no-banner --redact --exit-code 1 --source .
