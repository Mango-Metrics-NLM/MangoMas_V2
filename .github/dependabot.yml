# Keeps the SHA-pinned third-party actions fresh (spec-0022 R5). First-party
# actions/* stay tag-pinned by policy — tests/deploy/test_workflow_hardening.py
# encodes that split, so a Dependabot PR that flips it will fail CI visibly.
#
# Grouping: minor and patch bumps arrive as one PR per ecosystem per month
# instead of one PR per package (fifteen were open at once before this). A
# major bump is never grouped — it is a reviewed event, and for the exact-
# pinned toolchain pairs below it needs a companion edit in the other file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Python dependencies (supply-chain baseline, roadmap item 0.3): covers
  # pyproject.toml's version ranges.
  #
  # It does NOT cover requirements.lock, despite that file being what the
  # runtime image installs (Dockerfile's `-c`). Dependabot's pip ecosystem reads
  # the manifests it recognises — requirements.txt, requirements/*.txt,
  # pyproject.toml, setup.py, Pipfile, poetry.lock — and `requirements.lock` is
  # not one of them; its single-commit history under this configured ecosystem
  # is the evidence. The lock is kept honest by mechanism instead:
  # tests/deploy/test_lockfile_freshness.py fails when pyproject grows a runtime
  # dependency the lock does not pin, and `make pip-audit`'s second pass scans
  # the lock for CVEs. Renaming the file so Dependabot parses it is an open
  # decision (D13 in docs/analysis/20260919-council-rejection-and-replan.md).
  #
  # Lock-stepped pins (a Dependabot PR for one half needs the other edited in
  # the same commit; tests/tooling/test_toolchain_pin_parity.py and
  # tests/deploy/test_ci_make_parity.py fail CI otherwise):
  #   ruff        ↔ .pre-commit-config.yaml ruff-pre-commit rev
  #   mypy        ↔ .pre-commit-config.yaml mirrors-mypy rev
  #   coverage    ↔ pytest-cov (measurement semantics are the gate's denominator)
  #
  # ruff and mypy are excluded from the groups here and in the pre-commit entry:
  # their other half lives in a different ecosystem, so a grouped bump always
  # fails the parity test and would hold every other package's bump hostage.
  # Ungrouped, each arrives as its own PR to pair with its pre-commit twin.
  # coverage and pytest-cov share this ecosystem and stay grouped together.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      pip-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["ruff", "mypy"]
        update-types: ["minor", "patch"]
  # Sibling envelope package (pydantic>=2.7 today). Separate from the root
  # pip ecosystem so a contracts-only bump is its own PR.
  - package-ecosystem: pip
    directory: /mango-integration-contracts
    schedule:
      interval: monthly
    groups:
      contracts-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Pre-commit hook revs. `ruff` and `mypy` are exact-pinned in BOTH
  # pyproject.toml's dev extra and .pre-commit-config.yaml, and
  # tests/tooling/test_toolchain_pin_parity.py fails CI when the two drift.
  # Dependabot's pip ecosystem never touches this file, so without this entry
  # a ruff bump arrives as a pip-only PR that silently desyncs the toolchain —
  # contributors then run pre-commit on a different ruff than CI, which shows
  # up as a formatting diff nobody can reproduce. Groups cannot span
  # ecosystems, so the two PRs still arrive separately: merge them together,
  # or land one commit that bumps both files. The parity test is what makes
  # forgetting visible rather than silent.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["*ruff-pre-commit*", "*mirrors-mypy*"]
        update-types: ["minor", "patch"]

  # Base-image digests. The Dockerfile pins python:3.11-slim by digest in both
  # stages (supply-chain baseline); without this entry those digests were only
  # ever bumped by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
